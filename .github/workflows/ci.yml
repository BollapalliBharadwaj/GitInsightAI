name: GitInsight AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Node Build check)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    - name: Install Dependencies
      cwd: ./backend
      run: npm ci

    - name: Run Backend Tests
      cwd: ./backend
      run: echo "No tests configured yet"

  frontend-ci:
    name: Frontend CI (Node Build check)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Dependencies
      cwd: ./frontend
      run: npm ci

    - name: Compile Frontend Production Build
      cwd: ./frontend
      run: npm run build
